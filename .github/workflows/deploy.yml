name: Deploy su GitHub Pages

on:
  push:
    branches: [deploy]    # Si attiva ogni push sul branch deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Scarica il codice
      - uses: actions/checkout@v4

      # 2. Installa Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Installa dipendenze e builda
      - run: npm ci
      - run: npm run build

      # 4. Publica su GitHub Pages
      - uses: actions/deploy-pages@v4
        with:
          artifact-name: dist
          # Il nome della cartella di output di Vite

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4