<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Paper Puppy v.0.1  🐶</title>
  <style>
    * {
      margin: 0 !important;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }
    #game-container {
      display: block;
      justify-content: center;
      align-items: center;
      width: 100dvw;
      height: 100vh;
      position: fixed; /* Fissato alla viewport */
      top: 0;
      left: 0;
    }

    /* 🆕 Assicura che il canvas Phaser riempia lo spazio */
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
